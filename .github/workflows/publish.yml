name: publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Use a one-shot npm@latest via npx for OIDC support (needs npm >=11.5).
      # Self-upgrading the global npm in-place fails with MODULE_NOT_FOUND
      # mid-replace; npx avoids that by running from a separate prefix.
      - run: npx -y npm@latest publish --provenance --access public
